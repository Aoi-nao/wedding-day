
<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Day</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Times New Roman", serif;
    background: #faf7f2;
    color: #6b5140;
}


/* Trang bìa */

.cover {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

   background:
linear-gradient(
    rgba(250,247,242,0.55),
    rgba(250,247,242,0.55)
),
url("images/cover.jpg");

    background-size: cover;
    background-position: center;
}


h1 {

    font-size: 60px;
    font-weight: normal;

    letter-spacing: 6px;

    line-height: 1.4;

    margin: 0;

}


.and {

    font-size: 35px;

    margin: 15px;

}


.date {

    margin-top: 30px;

    font-size: 24px;

    letter-spacing: 4px;

}



.subtitle {

    margin-top: 15px;

    font-size:18px;

    letter-spacing:3px;

}



/* Hiệu ứng cánh hoa */

.petals {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
}


.petals span {

    position:absolute;

    top:-50px;

    font-size:22px;

    animation: fall linear infinite;

    opacity:0.8;

}


/* vị trí từng cánh */

.petals span:nth-child(1){
    left:10%;
    animation-duration:12s;
}

.petals span:nth-child(2){
    left:25%;
    animation-duration:16s;
}

.petals span:nth-child(3){
    left:40%;
    animation-duration:14s;
}

.petals span:nth-child(4){
    left:55%;
    animation-duration:18s;
}

.petals span:nth-child(5){
    left:70%;
    animation-duration:13s;
}

.petals span:nth-child(6){
    left:80%;
    animation-duration:17s;
}

.petals span:nth-child(7){
    left:90%;
    animation-duration:15s;
}

.petals span:nth-child(8){
    left:35%;
    animation-duration:20s;
}



@keyframes fall {

0% {
    transform:
    translateY(-50px)
    rotate(0deg);
}


100% {

    transform:
    translateY(110vh)
    rotate(360deg);

}

}
</style>

</head>






<section class="cover">


<h1>
CÔ DÂU<br>
<span class="and">&</span><br>
CHÚ RỂ
</h1>


<div class="date">

11 • 10 • 2026

</div>


<div class="subtitle">

SAVE THE DATE

</div>


</section>

</div>
