<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Day</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:"Times New Roman", serif;

    color:#6b5140;

    overflow:hidden;

}



/* ===== COVER ===== */


.cover{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;


    background:

    linear-gradient(
        rgba(250,247,242,0.55),
        rgba(250,247,242,0.55)
    ),

    url("images/cover.jpg");


    background-size:cover;

    background-position:center;

}



.title{

    opacity:0;

    animation:showText 2s ease forwards;

}



h1{

    margin:0;

    font-size:60px;

    font-weight:normal;

    letter-spacing:8px;

    line-height:1.4;

}



.and{

    font-size:35px;

}



.date{

    margin-top:30px;

    font-size:24px;

    letter-spacing:5px;

}



.subtitle{

    margin-top:15px;

    font-size:16px;

    letter-spacing:4px;

}




@keyframes showText{


from{

opacity:0;

transform:translateY(30px);

}


to{

opacity:1;

transform:translateY(0);

}


}





/* ===== PETALS ===== */


.petals{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:5;

}



.petal{

    position:absolute;

    top:-30px;

    width:15px;

    height:15px;


    background:#f2c7c9;


    border-radius:

    100% 0 100% 0;


    opacity:.8;


    animation:fall linear infinite;

}



.petal:nth-child(1){

left:10%;

animation-duration:12s;

}


.petal:nth-child(2){

left:25%;

animation-duration:16s;

}


.petal:nth-child(3){

left:40%;

animation-duration:13s;

}


.petal:nth-child(4){

left:55%;

animation-duration:18s;

}


.petal:nth-child(5){

left:70%;

animation-duration:15s;

}


.petal:nth-child(6){

left:85%;

animation-duration:20s;

}





@keyframes fall{


from{

transform:

translateY(-50px)

rotate(0deg);

}


to{

transform:

translateY(110vh)

rotate(360deg);

}


}







/* ===== MUSIC BUTTON ===== */


.music-wrapper{


    position:fixed;


    right:25px;


    bottom:25px;


    width:75px;


    height:75px;


    display:flex;


    align-items:center;


    justify-content:center;


    z-index:20;


}




#musicBtn{


    width:58px;


    height:58px;


    border-radius:50%;


    border:

    1px solid rgba(160,120,70,.5);



    background:

    rgba(255,250,240,.95);



    color:#8b6b45;



    font-size:27px;



    cursor:pointer;



    display:flex;



    align-items:center;



    justify-content:center;



    position:relative;



    z-index:2;



    box-shadow:

    0 8px 20px rgba(90,70,40,.25);



}



/* vòng sóng */


.sound-wave{


    position:absolute;


    width:58px;


    height:58px;


    border-radius:50%;


    border:

    1px solid rgba(160,120,70,.45);



    opacity:0;



}





.music-wrapper.playing .sound-wave{


    animation:

    wave 1.8s infinite;


}



@keyframes wave{


0%{

transform:scale(1);

opacity:.8;

}


100%{

transform:scale(1.8);

opacity:0;

}


}





/* MOBILE */


@media(max-width:600px){


h1{

font-size:40px;

}


.date{

font-size:18px;

}


}



</style>


</head>



<body>



<!-- MUSIC -->

<audio id="music" loop>

<source src="music/wedding.mp3" type="audio/mpeg">

</audio>




<!-- MUSIC BUTTON -->

<div class="music-wrapper">


<div class="sound-wave"></div>


<button id="musicBtn">

🎵

</button>


</div>





<!-- PETALS -->


<div class="petals">

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

</div>





<!-- COVER -->


<section class="cover">


<div class="title">


<h1>

CÔ DÂU

<br>

<span class="and">&</span>

<br>

CHÚ RỂ

</h1>



<div class="date">

11 • 10 • 2026

</div>



<div class="subtitle">

SAVE THE DATE

</div>



</div>


</section>







<script>


const music =

document.getElementById("music");



const btn =

document.getElementById("musicBtn");



const musicBox =

document.querySelector(".music-wrapper");



let playing=false;




btn.onclick=function(){



if(playing){



music.pause();


btn.innerHTML="🎵";


musicBox.classList.remove("playing");



}

else{


music.play();


btn.innerHTML="♫";


musicBox.classList.add("playing");



}



playing=!playing;



}



</script>



</body>


</html>
