<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Day</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:"Times New Roman", serif;

    color:#6b5140;

    overflow:hidden;

}



/* Trang mở đầu */

.cover{

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;


    background:

    linear-gradient(
        rgba(250,247,242,0.55),
        rgba(250,247,242,0.55)
    ),

    url("images/cover.jpg");


    background-size:cover;

    background-position:center;

}



/* Chữ */


.title{

    opacity:0;

    animation:showText 2s ease forwards;

}


h1{

    margin:0;

    font-size:60px;

    font-weight:normal;

    letter-spacing:8px;

    line-height:1.4;

}


.and{

    font-size:35px;

}



.date{

    margin-top:30px;

    font-size:24px;

    letter-spacing:5px;

}


.subtitle{

    margin-top:15px;

    font-size:16px;

    letter-spacing:4px;

}



@keyframes showText{


from{

    opacity:0;

    transform:translateY(30px);

}


to{

    opacity:1;

    transform:translateY(0);

}


}





/* ===== CÁNH HOA RƠI ===== */


.petals{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

}



.petal{

    position:absolute;

    top:-30px;

    width:15px;

    height:15px;

    background:#f2c7c9;

    border-radius:100% 0 100% 0;

    opacity:0.8;

    animation:fall linear infinite;

}





.petal:nth-child(1){

    left:10%;

    animation-duration:12s;

}


.petal:nth-child(2){

    left:25%;

    animation-duration:16s;

}


.petal:nth-child(3){

    left:40%;

    animation-duration:13s;

}


.petal:nth-child(4){

    left:55%;

    animation-duration:18s;

}


.petal:nth-child(5){

    left:70%;

    animation-duration:15s;

}


.petal:nth-child(6){

    left:85%;

    animation-duration:20s;

}





@keyframes fall{


0%{

    transform:
    translateY(-50px)
    rotate(0deg);

}


100%{

    transform:
    translateY(110vh)
    rotate(360deg);

}


}



</style>


</head>



<body>



<div class="petals">

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

<div class="petal"></div>

</div>




<section class="cover">


<div class="title">

<h1>

CÔ DÂU

<br>

<span class="and">&</span>

<br>

CHÚ RỂ

</h1>



<div class="date">

11 • 10 • 2026

</div>



<div class="subtitle">

SAVE THE DATE

</div>


</div>



</section>



</body>


</html>
