<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- =========================
     OPENING
========================= -->

<section
class="opening"
id="opening">

    <div class="opening__overlay"></div>

    <div class="opening__content">

        <p
        id="openingTitle"
        class="opening__title">
        </p>

        <h1
        id="openingNames"
        class="opening__names">
        </h1>

        <p
        id="openingDate"
        class="opening__date">
        </p>

        <button
        id="openingButton"
        class="opening__button">
        </button>

    </div>

</section>



<!-- PETALS -->

<div class="petals">

<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>

</div>



<!-- AUDIO -->

<audio
id="bgMusic">
</audio>



<!-- MUSIC BUTTON -->

<div
id="musicWrapper"
class="music-wrapper">

    <div class="sound-wave"></div>

    <button
    id="musicButton"
    class="music-button">
    </button>

</div>



<main
id="website">

<!-- =========================
     INVITATION
========================= -->

<section
class="invitation">

    <div class="invitation__content">

        <h2
        id="inviteHeading"
        class="invite-heading">
        </h2>

        <div
        class="invite-divider">

            ❦

        </div>

        <p
        id="inviteMessage"
        class="invite-message">
        </p>

        <div
        class="invite-heart">

            ♡

        </div>

        <p
        id="inviteFamily"
        class="invite-family">
        </p>

    </div>

</section>



<!-- =========================
     COUPLE
========================= -->

<section class="couple">

    <div class="couple__header">

        <p class="couple__subtitle">
            THE BRIDE & THE GROOM
        </p>

        <div class="couple__star">
            ✦
        </div>

    </div>

    <div class="couple__content">

        <article class="person">

            <div class="person__frame">

                <img
                    id="leftImage"
                    class="person__image"
                    alt="Bride">

            </div>

            <h3
                id="leftName"
                class="person__name">
            </h3>

        </article>



        <div class="couple__center">

            <div>✦</div>

            <div class="couple__heart">
                ♡
            </div>

            <div>✦</div>

        </div>



        <article class="person">

            <div class="person__frame">

                <img
                    id="rightImage"
                    class="person__image"
                    alt="Groom">

            </div>

            <h3
                id="rightName"
                class="person__name">
            </h3>

        </article>

    </div>



    <div class="couple__quote">

        <span></span>

        <p id="heroQuote"></p>

        <span></span>

    </div>

</section>
<!-- =========================
     TIMELINE
========================= -->

<section
class="timeline"
id="timeline">

    <div
    class="section-title"
    id="timelineTitle">
    </div>

    <div
    id="timelineList"
    class="timeline__list">
    </div>

</section>



<!-- =========================
     LOCATION
========================= -->

<section
class="location"
id="location">

    <div
    class="section-title"
    id="locationTitle">
    </div>

    <div
    class="location__content">

        <h3
        id="locationVenue"
        class="location__venue">
        </h3>

        <p
        id="locationAddress"
        class="location__address">
        </p>

        <a

        id="locationMap"

        class="button"

        target="_blank"

        rel="noopener">

        </a>

    </div>

</section>



<!-- =========================
     GALLERY
========================= -->

<section
class="gallery"
id="gallery">

    <div
    class="section-title"
    id="galleryTitle">
    </div>

    <div
    id="galleryGrid"
    class="gallery__grid">
    </div>

</section>



<!-- =========================
     RSVP
========================= -->

<section
class="rsvp"
id="rsvp">

    <div
    class="section-title"
    id="rsvpTitle">
    </div>

    <a

    id="rsvpButton"

    class="button"

    target="_blank"

    rel="noopener">

    </a>

</section>

</main>



<script src="js/config.js"></script>

<script src="js/script.js"></script>
</body>

</html>
