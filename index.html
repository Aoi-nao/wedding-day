<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wedding Invitation</title>

    <meta name="theme-color"
          content="#879C82">

    <meta name="description"
          content="Wedding Invitation">

    <link rel="icon"
          type="image/png"
          href="images/favicon.png">

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ==========================
            OPENING
    =========================== -->

    <section id="opening"
             class="opening">

        <div class="opening-overlay"></div>

        <img id="openingBackground"
             loading="eager"
             class="opening-background"
             src=""
             alt="Wedding Cover">

        <div class="opening-content">

            <p id="openingTitle"
               class="opening-title"></p>

            <h1 id="openingNames"
                class="opening-names"></h1>

            <p id="openingDate"
               class="opening-date"></p>

            <div class="opening-line"></div>

            <h2 id="openingHeading"
                class="opening-heading"></h2>

            <p id="openingMessage"
               class="opening-message"></p>

            <p id="openingFamily"
               class="opening-family"></p>

            <button id="openingButton"
                    aria-label="Mở thiệp cưới"
                    class="opening-button">

                MỞ THIỆP

            </button>

        </div>

    </section>

    <!-- ==========================
            WEBSITE
    =========================== -->

    <main id="website"
          class="website">

        <!-- ==========================
                HERO
        =========================== -->

        <section id="hero"
                 class="hero">

            <div class="hero-overlay"></div>

            <img id="heroImage"
                 loading="eager"
                 class="hero-image"
                 src=""
                 alt="Bride & Groom">

            <div class="hero-content">

                <p id="heroQuote"
                   class="hero-quote"></p>

                <div class="hero-divider"></div>

                <h1 id="heroNames"
                    class="hero-names"></h1>

                <p id="heroDate"
                   class="hero-date"></p>

            </div>

        </section>

        <!-- ==========================
                INVITATION
        =========================== -->

        <section id="invitation"
                 class="invitation">

            <div class="section-ornament"></div>

            <h2 id="inviteHeading"
                class="section-title"></h2>

            <p id="inviteMessage"
               class="section-text"></p>

            <p id="inviteFamily"
               class="section-family"></p>

            <div class="section-ornament bottom"></div>

        </section>
              <!-- ==========================
                COUPLE
        =========================== -->

        <section id="couple"
                 class="couple">

            <div class="section-ornament"></div>

            <h2 id="coupleTitle"
                class="section-title"></h2>

            <p id="coupleSubtitle"
               class="section-subtitle"></p>

            <div class="couple-wrapper">

                <!-- Bride -->

                <article class="person-card">

                    <img id="leftImage"
                         loading="lazy"
                         class="person-image"
                         src=""
                         alt="Bride">

                    <p id="leftRole"
                       class="person-role"></p>

                    <h3 id="leftName"
                        class="person-name"></h3>

                </article>

                <div class="couple-center">

                    <div class="couple-line"></div>

                    <div class="couple-and">

                        &

                    </div>

                    <div class="couple-line"></div>

                </div>

                <!-- Groom -->

                <article class="person-card">

                    <img id="rightImage"
                         loading="lazy"
                         class="person-image"
                         src=""
                         alt="Groom">

                    <p id="rightRole"
                       class="person-role"></p>

                    <h3 id="rightName"
                        class="person-name"></h3>

                </article>

            </div>

        </section>



        <!-- ==========================
                COUNTDOWN
        =========================== -->

        <section id="countdown"
                 class="countdown">

            <h2 id="countdownTitle"
                class="section-title"></h2>

            <p id="countdownSubtitle"
               class="section-subtitle"></p>

            <div class="countdown-wrapper">

                <div class="countdown-item">

                    <span id="dayValue"
                          class="count-value"></span>

                    <span class="count-label">

                        Ngày

                    </span>

                </div>

                <div class="countdown-item">

                    <span id="hourValue"
                          class="count-value"></span>

                    <span class="count-label">

                        Giờ

                    </span>

                </div>

                <div class="countdown-item">

                    <span id="minuteValue"
                          class="count-value"></span>

                    <span class="count-label">

                        Phút

                    </span>

                </div>

                <div class="countdown-item">

                    <span id="secondValue"
                          class="count-value"></span>

                    <span class="count-label">

                        Giây

                    </span>

                </div>

            </div>

        </section>



        <!-- ==========================
                TIMELINE
        =========================== -->

        <section id="timeline"
                 class="timeline">

            <div class="section-ornament"></div>

            <h2 id="timelineTitle"
                class="section-title"></h2>

            <div id="timelineContainer"
                 class="timeline-container">

                <!-- JS render -->

            </div>

        </section>
              <!-- ==========================
                LOCATION
        =========================== -->

        <section id="location"
                 class="location">

            <div class="section-ornament"></div>

            <h2 id="locationTitle"
                class="section-title"></h2>

            <p id="locationSubtitle"
               class="section-subtitle"></p>

            <div id="locationContainer"
                 class="location-wrapper">

                <!-- Render bằng JS -->

            </div>

        </section>



        <!-- ==========================
                RSVP
        =========================== -->

        <section id="rsvp"
                 class="rsvp">

            <div class="section-ornament"></div>

            <h2 id="rsvpTitle"
                class="section-title"></h2>

            <p id="rsvpSubtitle"
               class="section-subtitle"></p>

            <form id="rsvpForm"
                  class="rsvp-form">

                <div class="form-group">

                    <label id="rsvpNameLabel"
                           for="guestName"></label>

                    <input id="guestName"
                           autocomplete="name"
                           type="text"
                           class="form-input">

                </div>

                <div class="form-group">

                    <label id="attendanceLabel"></label>

                    <div id="attendanceOptions"
                         class="attendance-options">

                        <!-- Render bằng JS -->

                    </div>

                </div>

                <div id="guestCountGroup"
                     class="form-group">

                    <label id="guestCountLabel"></label>

                    <div class="guest-stepper">

                        <button id="minusGuest"
                                type="button"
                                class="stepper-btn">

                            −

                        </button>

                        <span id="guestCountValue">

                            1

                        </span>

                        <button id="plusGuest"
                                type="button"
                                class="stepper-btn">

                            +

                        </button>

                    </div>

                </div>

                <button id="submitRSVP"
                        aria-label="Gửi xác nhận tham dự"
                        type="submit"
                        class="primary-button">

                </button>

            </form>

        </section>



        <!-- ==========================
                GIFT
        =========================== -->

        <section id="gift"
                 class="gift">

            <div class="section-ornament"></div>

            <h2 id="giftTitle"
                class="section-title"></h2>

            <p id="giftSubtitle"
               class="section-subtitle"></p>

            <div id="giftSlider"
                 class="gift-slider">

                <!-- Render bằng JS -->

            </div>

        </section>
           <!-- ==========================
                WEDDING WISHES
        =========================== -->

        <section id="wishes"
                 class="wishes">

            <div class="section-ornament"></div>

            <h2 id="wishesTitle"
                class="section-title"></h2>

            <p id="wishesSubtitle"
               class="section-subtitle"></p>

            <form id="wishForm"
                  class="wish-form">

                <div class="form-group">

                    <input id="wishName"
                           autocomplete="name"
                           class="form-input"
                           type="text"
                           placeholder="">

                </div>

                <div class="form-group">

                    <textarea id="wishMessage"
                              class="form-textarea"
                              rows="5"
                              placeholder=""></textarea>

                </div>

                <button id="wishSubmit"
                        aria-label="Gửi lời chúc"
                        type="submit"
                        class="primary-button">
                </button>

            </form>

            <div id="wishList"
                 class="wish-list">

                <!-- JS Render -->

            </div>

        </section>



        <!-- ==========================
                GALLERY
        =========================== -->

        <section id="gallery"
                 class="gallery">

            <div class="section-ornament"></div>

            <h2 id="galleryTitle"
                class="section-title"></h2>

            <p id="gallerySubtitle"
               class="section-subtitle"></p>

            <p id="galleryDescription"
               class="section-description"></p>

            <div id="galleryGrid"
                 class="gallery-grid">

                <!-- JS Render -->

            </div>

        </section>



        <!-- ==========================
                FOOTER
        =========================== -->

        <footer id="footer"
                class="footer">

            <p id="footerThanks"
               class="footer-thanks"></p>

            <div class="footer-heart">

                ♡

            </div>

            <h3 id="footerNames"
                class="footer-names"></h3>

            <p id="footerCopyright"
               class="footer-copy"></p>

        </footer>

    </main>



    <!-- ==========================
            MUSIC BUTTON
    =========================== -->

    <button id="musicButton"
            aria-label="Bật hoặc tắt nhạc nền"
            class="music-button"
            aria-label="Music">

        <span id="musicIcon">

            ♪

        </span>

    </button>



    <!-- ==========================
            PETALS
    =========================== -->

    <div id="petals"
         class="petals">

    </div>



    <!-- ==========================
            BACKGROUND MUSIC
    =========================== -->

    <audio id="bgMusic"
           loop>

        <source src="music/wedding.mp3"
                type="audio/mpeg">

    </audio>



    <!-- ==========================
            CONFIG
    =========================== -->

    <script src="js/config.js"></script>

    <!-- ==========================
            SCRIPT
    =========================== -->

    <script src="js/script.js"></script>

</body>

</html>
