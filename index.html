<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thiệp Cưới CHUN & DAM</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Times New Roman", serif;
color:#6b5140;
overflow:hidden;
}


/* ===== MÀN HÌNH MỞ THIỆP ===== */

.opening{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

text-align:center;


background:

linear-gradient(
rgba(250,247,242,.65),
rgba(250,247,242,.65)
),

url("images/cover.jpg");


background-size:cover;

background-position:center;

z-index:50;

transition:

opacity 1.5s ease,

visibility 1.5s;

}


.opening.hide{

opacity:0;

visibility:hidden;

}


.open-content{

animation:fadeUp 2s ease;

}


.small-title{

font-size:15px;

letter-spacing:5px;

margin-bottom:45px;

}



.names{

font-size:65px;

font-weight:normal;

letter-spacing:12px;

line-height:1.35;

}


.amp{

font-size:35px;

}



.open-date{

margin-top:45px;

font-size:20px;

letter-spacing:6px;

}




.open-btn{

margin-top:55px;

padding:14px 45px;

border:

1px solid rgba(130,100,70,.5);


background:

rgba(255,255,255,.45);


font-size:14px;

letter-spacing:5px;

color:#6b5140;

cursor:pointer;

}



/* ===== TRANG CHÍNH ===== */


.main{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;


background:

linear-gradient(
rgba(250,247,242,.55),
rgba(250,247,242,.55)
),

url("images/cover.jpg");


background-size:cover;

background-position:center;

}



.main h1{

font-size:65px;

font-weight:normal;

letter-spacing:12px;

}



.main-date{

font-size:22px;

letter-spacing:7px;

margin-top:35px;

}



@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



/* ===== CÁNH HOA ===== */


.petals{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:10;

}


.petal{

position:absolute;

top:-30px;

width:15px;

height:15px;

background:#f2c7c9;

border-radius:100% 0 100% 0;

opacity:.75;

animation:fall linear infinite;

}


.petal:nth-child(1){
left:10%;
animation-duration:12s;
}

.petal:nth-child(2){
left:25%;
animation-duration:16s;
}

.petal:nth-child(3){
left:40%;
animation-duration:13s;
}

.petal:nth-child(4){
left:60%;
animation-duration:18s;
}

.petal:nth-child(5){
left:75%;
animation-duration:15s;
}

.petal:nth-child(6){
left:90%;
animation-duration:20s;
}



@keyframes fall{

from{

transform:
translateY(-50px)
rotate(0deg);

}

to{

transform:
translateY(110vh)
rotate(360deg);

}

}



/* ===== NÚT NHẠC ===== */


.music-wrapper{

position:fixed;

right:25px;

bottom:25px;

width:70px;

height:70px;

display:flex;

justify-content:center;

align-items:center;

z-index:30;

opacity:0;

transition:1s;

}



.music-wrapper.show{

opacity:1;

}



#musicBtn{

width:55px;

height:55px;

border-radius:50%;

border:1px solid rgba(160,120,70,.5);

background:rgba(255,250,240,.95);

font-size:25px;

color:#8b6b45;

cursor:pointer;

z-index:2;

}



.sound-wave{

position:absolute;

width:55px;

height:55px;

border-radius:50%;

border:1px solid rgba(160,120,70,.4);

opacity:0;

}



.music-wrapper.playing .sound-wave{

animation:wave 1.8s infinite;

}



@keyframes wave{

from{

transform:scale(1);

opacity:.8;

}

to{

transform:scale(1.8);

opacity:0;

}

}


</style>

</head>


<body>


<!-- Màn hình mở -->

<div class="opening" id="opening">

<div class="open-content">


<div class="small-title">

THIỆP CƯỚI

</div>


<div class="names">

CHUN

<br>

<span class="amp">&</span>

<br>

DAM

</div>


<div class="open-date">

17 • 10 • 2026

</div>


<button class="open-btn" id="openBtn">

MỞ THIỆP

</button>


</div>

</div>



<!-- Nhạc -->

<audio id="music" loop>

<source src="music/wedding.mp3" type="audio/mpeg">

</audio>



<!-- Trang chính -->

<section class="main">

<div>

<h1>

CHUN

<br>

&

<br>

DAM

</h1>


<div class="main-date">

17 • 10 • 2026

</div>


</div>

</section>



<!-- Hoa -->

<div class="petals">

<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>
<div class="petal"></div>

</div>



<!-- Nút nhạc -->

<div class="music-wrapper" id="musicBox">

<div class="sound-wave"></div>

<button id="musicBtn">

🎵

</button>

</div>



<script>


const openBtn =
document.getElementById("openBtn");


const opening =
document.getElementById("opening");


const music =
document.getElementById("music");


const musicBox =
document.getElementById("musicBox");


const musicBtn =
document.getElementById("musicBtn");


let playing=false;



openBtn.onclick=function(){

opening.classList.add("hide");

music.play();

musicBox.classList.add("show");

musicBox.classList.add("playing");

musicBtn.innerHTML="♫";

playing=true;

}



musicBtn.onclick=function(){


if(playing){

music.pause();

musicBtn.innerHTML="🎵";

musicBox.classList.remove("playing");


}else{

music.play();

musicBtn.innerHTML="♫";

musicBox.classList.add("playing");

}


playing=!playing;


}


</script>


</body>

</html>
