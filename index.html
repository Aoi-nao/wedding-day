<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- =========================
     OPENING
========================= -->

<section
class="opening"
id="opening">

    <div class="opening__overlay"></div>

    <div class="opening__content">

        <p
        id="openingTitle"
        class="opening__title">
        </p>

        <h1
        id="openingNames"
        class="opening__names">
        </h1>

        <p
        id="openingDate"
        class="opening__date">
        </p>

        <button
        id="openingButton"
        class="opening__button">
        </button>

    </div>

</section>



<!-- PETALS -->

<div class="petals">

<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>
<span class="petal"></span>

</div>



<!-- AUDIO -->

<audio
id="bgMusic">
</audio>



<!-- MUSIC BUTTON -->

<div
id="musicWrapper"
class="music-wrapper">

    <div class="sound-wave"></div>

    <button
    id="musicButton"
    class="music-button">
    </button>

</div>



<main
id="website">

<!-- =========================
     HERO
========================= -->

<section
class="hero">

    <div
    class="hero__content">

        <p
        id="heroQuote"
        class="hero__quote">
        </p>

        <h2
        id="heroNames"
        class="hero__names">
        </h2>

        <p
        id="heroDate"
        class="hero__date">
        </p>

    </div>

</section>



<!-- =========================
     COUPLE
========================= -->

<section
class="couple">

    <article
    class="person">

        <p
        id="leftRole"
        class="person__role">
        </p>

        <div
        class="person__frame">

            <img

            id="leftImage"

            class="person__image"

            alt="">

        </div>

        <h3

        id="leftName"

        class="person__name">

        </h3>

    </article>



    <div
    class="couple__heart">

        ♡

    </div>



    <article
    class="person">

        <p

        id="rightRole"

        class="person__role">

        </p>

        <div

        class="person__frame">

            <img

            id="rightImage"

            class="person__image"

            alt="">

        </div>

        <h3

        id="rightName"

        class="person__name">

        </h3>

    </article>

</section>
<!-- =========================
     TIMELINE
========================= -->

<section
class="timeline"
id="timeline">

    <div
    class="section-title"
    id="timelineTitle">
    </div>

    <div
    id="timelineList"
    class="timeline__list">
    </div>

</section>



<!-- =========================
     LOCATION
========================= -->

<section
class="location"
id="location">

    <div
    class="section-title"
    id="locationTitle">
    </div>

    <div
    class="location__content">

        <h3
        id="locationVenue"
        class="location__venue">
        </h3>

        <p
        id="locationAddress"
        class="location__address">
        </p>

        <a

        id="locationMap"

        class="button"

        target="_blank"

        rel="noopener">

        </a>

    </div>

</section>



<!-- =========================
     GALLERY
========================= -->

<section
class="gallery"
id="gallery">

    <div
    class="section-title"
    id="galleryTitle">
    </div>

    <div
    id="galleryGrid"
    class="gallery__grid">
    </div>

</section>



<!-- =========================
     RSVP
========================= -->

<section
class="rsvp"
id="rsvp">

    <div
    class="section-title"
    id="rsvpTitle">
    </div>

    <a

    id="rsvpButton"

    class="button"

    target="_blank"

    rel="noopener">

    </a>

</section>

</main>



<script src="js/config.js"></script>

<script src="js/script.js"></script>
</body>

</html>
